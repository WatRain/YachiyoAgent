<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>八千代 · Live2D</title>
<style>
  /* 背景必须透明：这一页的画面会被贴到界面的玻璃面板上。
     只要这里出现任何不透明底色，看到的就是一块方块。 */
  /* ★★ Chromium 给每个 iframe 铺的"底色"（canvas 基色）由两件事决定，
     实测环境：Electron 44 / Chromium 152，工具 scratch/pet_bg.py、scratch/pet_transp*.py：

       | 状态                                                   | 面板上看到的               |
       |--------------------------------------------------------|----------------------------|
       | 祖先元素 color-scheme: dark + 本页根背景 transparent    | 面板玻璃原样透上来 ✓（深浅主题都一样）|
       | 祖先元素 color-scheme: light（浅色主题默认）            | 不透明深块 #121212 ✗        |
       | 本页声明 color-scheme: light / normal                   | 不透明近白 rgb(253,254,255) |
       | 本页根元素 background-color 设成洋红                    | 整块洋红 ✓（根背景=canvas 基色）|

     结论：**祖先的 color-scheme 才是开关**，它在 desktop/renderer/style.css 的 `.stage` 上被钉成
     dark（浅色主题下照样），所以这一页保持"什么都不画"。父页面传 ?theme= 只是记进
     state.theme / data-theme 供排查，这一页不按主题换底色 —— 换过就变成一块和聊天卡片
     不一样的方块（曾经踩过两次：纯白、以及 #121212 深块）。
     万一哪天祖先的 color-scheme 又变回 light，本页 root 自己画 background 也能救
     （见上面最后一行：根背景直接就是 canvas 基色）。 */
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
  }
  canvas { display: block; background: transparent; }

  /* ── 独立窗口模式（?window=1）：这一页自己就是那个透明无边框窗口 ──
     根元素和 body 都必须是透明的，少一层就会在桌面上留一块方底色。
     光标和 touch-action 是为了拖动：拖动是自己实现的（见文件末尾那段脚本）。 */
  html.pet-standalone, html.pet-standalone body { background: transparent; }
  html.pet-standalone { cursor: grab; user-select: none; touch-action: none; }
  html.pet-standalone.dragging { cursor: grabbing; }
</style>
</head>
<body>
<!-- 依赖全部走本地 + 一个 import map。
     引擎的 ESM 版本里有 `from "pixi.js"` 这种裸模块名，浏览器自己解析不了，
     import map 就是干这个的。 -->
<script type="importmap">
{
  "imports": {
    "pixi.js": "/static/vendor/pixi.min.mjs"
  }
}
</script>

<script>
/* ── 第一段：先把对外接口挂上，什么依赖都不等 ──
 *
 * ★ 为什么必须先挂接口：
 *   之前把依赖写成普通 <script src>（其中 Cubism Core 来自 CDN）时，
 *   浏览器解析 HTML 会停下来等，网络一慢后面那段建模型的脚本就永远不执行，
 *   而 Python 那边只看到"window.yachiyo 是 undefined"，完全不知道卡在哪。
 *   现在接口先就位，卡在哪一步都能从 state() 里读出来。
 */
(() => {
  "use strict";

  const diag = [];
  const state = {
    ready: false,
    error: "",
    stage: "boot",        // 当前进行到哪一步，排查用
    frames: 0,
    scale: 1,
    canvas: [0, 0],
    model: [0, 0],
    mouth: 0,
    mouthPath: "",        // 口型参数写在哪个对象上（不同版本路径不一样）
    look: null,           // 当前的视线目标（画面坐标），null = 正前方
    renderedEye: null,    // 最近一帧**渲染时**真正用到的眼球参数（±1）
    autoTick: false,      // 页面自带的兜底循环有没有在跑（外部驱动时必须关）
    externalDrive: false, // 帧是不是由外部（Python）驱动
    modelAutoUpdate: null, // 模型的自动更新（挂在全局共享 ticker 上）有没有关掉
    tickerAlive: null,
    theme: null,           // 当前主题（dark/light），只作诊断 —— 底色透明与否由祖先 color-scheme 决定
    physics: null,         // 物理（头发/衣摆）在不在跑：false 换帧率
    deps: {},
  };

  window.__yachiyo = {
    say(msg) {
      diag.push(String(msg));
      if (diag.length > 80) diag.shift();
      console.log("[yachiyo] " + msg);
    },
    state,
    snapshot() {
      return Object.assign({}, state, { diag: diag.slice(-25) });
    },
    fail(message) {
      state.error = String(message);
      window.__yachiyo.say("失败：" + state.error);
    },
    /* 主题只记进 state.theme / data-theme 供排查。★ 这一页两个主题下都保持透明：
       底色那块由**祖先元素的 color-scheme** 决定，已在 style.css 的 `.stage` 上钉成 dark，
       详见 <style> 里的表。父页面用 ?theme= 传主题，切换主题时再调这里。 */
    setTheme(name) {
      const asked = name === "light" ? "light" : "dark";
      state.theme = asked;
      document.documentElement.dataset.theme = asked;
      return asked;
    },
  };

  const notReady = () => {
    throw new Error("模型还没就绪（stage=" + state.stage
                    + (state.error ? "，error=" + state.error : "") + "）");
  };

  window.yachiyo = {
    get ready() { return state.ready; },
    get error() { return state.error; },
    state() { return window.__yachiyo.snapshot(); },
    setMouth() { return notReady(); },
    setExpression() { return notReady(); },
    playMotion() { return notReady(); },
    setScale() { return notReady(); },
    listMotions() { return notReady(); },
    listExpressions() { return notReady(); },
    lookAt() { return notReady(); },
    lookForward() { return notReady(); },
    eyeBall() { return notReady(); },
    setPhysics() { return notReady(); },
    setTheme(name) { return window.__yachiyo.setTheme(name); },
  };

  window.__yachiyo.say("接口就位");
})();
</script>

<script type="module">
/* ── 第二段：加载依赖 → 建 PIXI → 载模型 ──
 *
 * 用 ESM + import map，而不是 UMD 全局：
 *   PIXI 8 的 dist/pixi.min.js 实测**不是** UMD（结尾是 `h}({});`，
 *   globalThis.PIXI 出现 0 次），靠全局名会踩空。
 *   ESM 里谁依赖谁写得明明白白。
 *
 * Cubism Core 仍是**普通脚本**、来自 Live2D 官方 CDN，并且必须**先于**引擎加载：
 *   引擎在模块求值时就会检查 Cubism 运行时在不在，不在会抛
 *   "Could not find Cubism 4 runtime..."（这个坑实测踩过）。
 *   所以引擎是用动态 import() 拉的，顺序完全由我们控制。
 */
const Y = window.__yachiyo;
const state = Y.state;
const say = (m) => Y.say(m);

const PIXI_URL = "/static/vendor/pixi.min.mjs";
const ENGINE_URL = "/static/vendor/pixi-live2d-engine.cubism.es.js";
/* Cubism Core 从 Live2D 官方 CDN 取：不由我们分发，也是官方示例的做法。
   首次加载后浏览器会缓存。 */
const CORE_URL = "https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js";

const MOUTH_PARAM = "ParamMouthOpenY";
const WORK_MEMORY_MB = 32;      // 模型 796 个参数，默认 16MB 容易不够

let app = null;
let model = null;
let coreModel = null;
let baseScale = 1;

/** 动态插普通脚本，带超时 —— 卡住时要能失败，而不是无限等 */
function loadScript(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) { settled = true; reject(new Error("加载超时(" + timeoutMs + "ms)：" + url)); }
    }, timeoutMs);
    el.src = url;
    el.onload = () => { if (!settled) { settled = true; clearTimeout(timer); resolve(url); } };
    el.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); reject(new Error("加载失败：" + url)); } };
    document.head.appendChild(el);
  });
}

/** 不同版本的引擎，coreModel 挂的位置不一样，这里都试一遍并记下用哪条路 */
function findCoreModel(m) {
  const im = m.internalModel;
  const tries = [
    ["internalModel.coreModel", im && im.coreModel],
    ["internalModel.motionManager.coreModel", im && im.motionManager && im.motionManager.coreModel],
    ["internalModel._coreModel", im && im._coreModel],
  ];
  for (const [path, value] of tries) {
    if (value && typeof value.setParameterValueById === "function") {
      state.mouthPath = path;
      return value;
    }
  }
  return null;
}

/** 参数名的两种形态：CubismId 对象（有 getString）或裸串 */
function paramName(id) {
  if (!id) return "";
  if (typeof id === "string") return id;
  if (typeof id.getString === "function") {
    const s = id.getString();
    return s && s.s ? s.s : String(s);
  }
  if (id._id && id._id.s) return id._id.s;
  return String(id);
}

/** 按名字找参数下标。
 *  ★ 为什么不用 coreModel.getParameterValueById("ParamEyeBallX")：
 *    那条路要求名字**已经注册进引擎的 id 表**，没写过就读会返回 null
 *    （实测：本模型 796 个参数，按名字读 ParamEyeBallX / ParamMouthOpenY 都是 null，
 *      先 set 一次再读才拿到值）。
 *    底层 core model 的 parameters.ids / parameters.values 是按下标对齐的，
 *    直接查下标最可靠。 */
const _paramIndexCache = new Map();
function paramIndex(want) {
  if (!coreModel) return -1;
  const raw = coreModel._model;
  const ids = raw && raw.parameters && raw.parameters.ids;
  if (!ids) return -1;
  for (let i = 0; i < ids.length; i++) {
    if (paramName(ids[i]) === want) return i;
  }
  return -1;
}

/** 按下标读当前参数值（读不到返回 null） */
function paramValue(index) {
  if (index < 0 || !coreModel) return null;
  const raw = coreModel._model;
  const values = raw && raw.parameters && raw.parameters.values;
  if (!values || index >= values.length) return null;
  return values[index];
}

/** ★ 引擎按"参数名"写参数时用的是**对象身份**比较
 *  （`getParameterIndex`：`parameterId != this._parameterIds.at(i)`），
 *  而这个模型里两边的 CubismId 不是同一个实例 → 查不到 → 引擎给这个名字
 *  分配一个**虚构下标**（实测：模型只有 796 个参数，ParamEyeBallX 却拿到 832）
 *  → `addParameterValueById` 静默失效。
 *  症状：视线坐标明明到了焦点控制器（targetX=-0.93），眼球参数却一动不动
 *  （恒等于默认值 0.23 / 0.25）。
 *
 *  这里把 getParameterIndex 换成按**名字**比较 —— 于是所有按名字的读写
 *  （addParameterValueById / setParameterValueById / getParameterValueById）
 *  都落到真实下标上。查不到的名字仍旧走引擎原来的逻辑。 */
function patchParameterIndexById(cm) {
  if (!cm || cm.__namePatch) return false;
  const ids = cm._parameterIds;
  if (!ids || typeof ids.getSize !== "function" || typeof ids.at !== "function") return false;
  const original = cm.getParameterIndex.bind(cm);
  /* ★ 先把名字表建好，**不要**每次线性扫描：
   *   引擎一帧会按名字查约 75 次，这个模型有 796 个参数，于是每帧几万次字符串比较。
   *   不过 A/B/A/B 实测两种写法**没有可分辨的差别**（都在 18~20ms 的噪声里，
   *   见 scratch/probe_perf9.py）—— 保留 Map 只是因为它更直观、做的无用功更少。
   *   查不到的名字仍旧走引擎原来的逻辑。 */
  const byName = new Map();
  for (let i = 0; i < ids.getSize(); i++) {
    const name = paramName(ids.at(i));
    if (!byName.has(name)) byName.set(name, i);
  }
  cm.getParameterIndex = function (parameterId) {
    const found = byName.get(paramName(parameterId));
    return found === undefined ? original(parameterId) : found;
  };
  cm.__namePatch = true;
  return true;
}

/** ★ 焦点这类"每帧叠加"的参数只在**渲染那一瞬间**有效，抓完帧再读就没了。
 *
 *  引擎一帧的顺序（实测轨迹，core=核心参数值）：
 *    saveParameters(前) core=0.1226
 *    updateFocus(后)    core=0.0839   ← 把焦点(-0.039)加进去
 *    coreModel.update   core=0.0839   ← ★ 渲染用的就是这一刻的值
 *    loadParameters(后) core=0.1226   ← 参数被读回上一层，焦点叠加被撤掉
 *  所以在 tick 之后读参数，读到的是基数（一直是 0.23 那个值），
 *  很容易误判成"焦点根本没进模型"。这里把渲染那一刻的值抄下来。 */
function watchRenderedParameters(cm, iEyeX, iEyeY) {
  if (!cm || cm.__watched) return false;
  const original = cm.update.bind(cm);
  cm.update = function (...args) {
    state.renderedEye = { x: paramValue(iEyeX), y: paramValue(iEyeY) };
    /* 帧计数也挂在这里 —— 这是**唯一**保证每渲染帧走一次的地方。
       不能只数 tick()：产品模式下帧是引擎自己的 PIXI ticker 驱动的
       （rAF 节流），根本不经过 tick()，那样界面上会一直显示 0 fps。 */
    state.frames += 1;
    return original(...args);
  };
  cm.__watched = true;
  return true;
}

function fit() {
  if (!app || !model) return;
  const w = app.screen.width;
  const h = app.screen.height;
  state.canvas = [Math.round(w), Math.round(h)];
  state.model = [Math.round(model.width), Math.round(model.height)];

  /* ★ 用**真实绘制范围**（getLocalBounds）来适配，而不是 model.width/height。
   *
   * 原因（实测数据）：
   *   模型的绘制范围在局部坐标里是 (213, 722) → (3680, 7871)：
   *   尺寸和 model.width/height 一样（3467×7149），但**原点偏了 722**。
   *   按 width/height + anchor(0.5,1) 摆放，内容会整体高出画面约 74px ——
   *   表现就是"角色的头被切掉、下面反而空一条"。
   */
  model.anchor.set(0, 0);
  model.scale.set(1);
  const b = model.getLocalBounds();
  const hasBounds = b && b.width > 1 && b.height > 1;
  const boxW = hasBounds ? b.width : model.width;
  const boxH = hasBounds ? b.height : model.height;
  const boxX = hasBounds ? b.x : 0;
  const boxY = hasBounds ? b.y : 0;

  baseScale = Math.min(w / boxW, h / boxH);
  const s = baseScale * state.scale;
  model.scale.set(s);
  // 让内容框的"底边中点"落在画面底部中央
  model.position.set(w / 2 - (boxX + boxW / 2) * s, h - (boxY + boxH) * s);

  /* 视线场的零点：模型内容框的中心 —— 引擎归一化后的 (0, 0) 就落在这一点上。
     内容框横向居中、底边贴着画面底部，所以中心 x 恒为 w/2、中心 y = h − 内容高/2。
     窗口比例一变内容框的高矮就变，所以每次 fit 都得重算。 */
  state.gazeAnchor = [w / 2, h - (boxH / 2) * s];
}

/* 视线场的半宽/半高 = 画面半宽/半高 × GAZE_SPAN。
   1 = 整个窗口都是线性区；调大更钝（窗口边缘也到不了 ±1），调小更灵（没到边缘就顶满）。
   只有独立浮窗用得上（见 lookAt）。 */
const GAZE_SPAN = 1;

/* 这一页有两种用法：面板里的 iframe（不带 ?window）和脱离后的独立浮窗（?window=1）。
   视线场只在浮窗里改成"整窗线性"；面板里保持引擎原本的 model.focus（有效区只在正中一小块）。 */
const STANDALONE = new URLSearchParams(location.search).get("window") === "1";

/** 给贴图源补上引擎要读的 `_gpuData` 字段（原因见调用处的注释）。返回补了几个。 */
function patchTextureGpuData(m) {
  let patched = 0;
  for (const texture of (m.textures || [])) {
    const source = texture && texture.source;
    if (source && !source._gpuData) {
      source._gpuData = Object.create(null);
      patched += 1;
    }
  }
  return patched;
}

async function start() {
  const params = new URLSearchParams(location.search);
  // 主题：只记进 state.theme 供排查；这一页的底色透明与否由祖先 color-scheme 决定，见 <style>
  say("主题：" + (params.get("theme") || "未传")
      + " → 本页恒透明，state.theme=" + Y.setTheme(params.get("theme")));
  const modelUrl = params.get("model");
  if (!modelUrl) {
    return Y.fail("缺少 ?model= 参数");
  }

  state.stage = "loading-core";
  say("加载 Cubism Core（官方 CDN，需要联网）…");
  await loadScript(CORE_URL, 25000);
  if (typeof Live2DCubismCore === "undefined") {
    return Y.fail("Cubism Core 没加载成功（需要联网从官方 CDN 取）");
  }
  say("Cubism Core " + Live2DCubismCore.Version.csmGetVersion());

  state.stage = "loading-pixi";
  const PIXI = await import(PIXI_URL);
  state.deps.pixi = PIXI.VERSION;

  state.stage = "loading-engine";
  const engine = await import(ENGINE_URL);
  state.deps.engine = !!(engine && engine.Live2DModel && engine.Live2DPlugin);
  if (!state.deps.engine) {
    return Y.fail("Live2D 引擎没加载成功");
  }
  say("PIXI " + state.deps.pixi + "，引擎就绪");

  if (typeof engine.configureCubismSDK === "function") {
    engine.configureCubismSDK({ memorySizeMB: WORK_MEMORY_MB });
  }

  /* ── 帧率上限 ──
   *
   * ★ 为什么要封顶（实测，CDP Performance 域）：
   *   静置 1.5 秒里 TaskDuration=1.511s、ScriptDuration=1.486s —— **主线程 ~99%
   *   的时间都在跑脚本**，几乎全是这个模型的 update + render。这台机器的屏幕是
   *   75Hz（父页面 rAF 中位间隔 13.3ms），模型就跟着跑 75fps。封到 60 直接省下
   *   约 20% 的主线程，留给界面（切主题、发消息、滚动）——这些一旦发生就会掉帧。
   *   60 也能整除 60Hz 屏（绝大多数用户），不会出现 75/60 那种 3:2 的节奏抖动。
   *
   * ★ 真正的闸门在本页自己的 rAF 循环（下面的 startPacer），这里的 maxFPS 只是
   *   顺手设上：万一将来有谁把 PIXI 的 ticker 又启动了，至少还有个上限兜着。
   *   实测 PIXI 自己的 maxFPS 不干净（~68.8fps 且节奏不规则，脚本时间只省 4.5%），
   *   所以产品不靠它 —— 见 startPacer 上面那段注释里的数字与 PIXI 源码判据。
   *
   * ★ 声明放这里而不是下面 ticker 那一段：app.init 之后马上就要用（下面那句
   *   applyFrameCap()），`let` 有暂时性死区，放后面会报
   *   "Cannot access 'frameCap' before initialization"（已踩）。
   *
   * 0 = 不封顶。父页面在切主题的过渡期间会临时调低（setFrameCap(20)）再调回来。
   */
  const DEFAULT_FPS_CAP = 60;
  let frameCap = DEFAULT_FPS_CAP;

  function applyFrameCap() {
    const v = frameCap > 0 ? frameCap : 0;
    try { if (app && app.ticker) app.ticker.maxFPS = v; } catch (e) { /* 忽略 */ }
    try {
      if (Y.PIXI && Y.PIXI.Ticker && Y.PIXI.Ticker.shared) Y.PIXI.Ticker.shared.maxFPS = v;
    } catch (e) { /* 忽略 */ }
    state.fpsCap = v;
    return v;
  }

  state.stage = "creating-app";
  PIXI.extensions.add(engine.Live2DPlugin);      // 必须先注册渲染管线
  app = new PIXI.Application();
  await app.init({
    resizeTo: window,
    preference: "webgl",
    backgroundAlpha: 0,                          // ★ 透明
    antialias: params.get("aa") !== "0",
    powerPreference: params.get("hp") === "0" ? "default" : "high-performance",
    autoDensity: true,
    resolution: window.devicePixelRatio || 1,
  });
  document.body.appendChild(app.canvas);
  say("PIXI Application 建好了，canvas=" + app.renderer.width + "x" + app.renderer.height);
  Y.app = app;                 // 挂到内部对象上：诊断/排查时用（Python 能通过 CDP 读到）
  Y.PIXI = PIXI;               // 同上：Python 侧要自己建 RenderTexture 时必须拿得到这个命名空间
  applyFrameCap();             // 帧率上限（见上面那段注释）：真正的闸门在下面的 pacer
  say("帧率上限：" + (frameCap || "不封顶") + "fps（由本页 pacer 执行）");

  state.stage = "loading-model";
  say("加载模型：" + modelUrl);
  /* texture LOD 策略（引擎自带）：
       full（默认）      给大图集生成完整 mipmap 链
       single-auto       按模型实际屏幕尺寸生成一张低分辨率贴图
       false             只用原图，不生成 mipmap
     实测默认值会在"上传贴图"这步失败（Failed to upload Live2D texture），
     所以留成可配的，排查时能一个个试。 */
  const lod = params.get("lod");
  const modelOptions = lod ? { textureOptions: { lod: lod === "false" ? false : lod } } : {};
  say("贴图 LOD 选项：" + JSON.stringify(modelOptions));
  model = await engine.Live2DModel.from(modelUrl, modelOptions);
  app.stage.addChild(model);
  Y.model = model;

  /** 兼容补丁 —— 不补这一步，模型永远画不出来（而且报错极具误导性）。
   *
   * 引擎渲染时读 `texture.source._gpuData[renderer.uid]`，
   * 但 **PIXI 8.13.1 的 TextureSource 上并没有 `_gpuData` 这个字段**
   * （`renderer.texture.bind()` 内部不碰它，所以单独调 bind 是好的）。
   * 读一个 undefined 的属性会抛 "Cannot convert undefined or null to object"，
   * 而引擎把这句吞掉、换成 "Failed to upload Live2D texture." —— 于是
   * 现象是"模型就绪但画面永远空白"，查起来非常费劲。
   *
   * 补一个空对象即可：引擎读到 undefined 会判成"还没上传"，走正常的 bind 路径。
   * 如果哪天引擎或 PIXI 修好了，这个补丁会自动什么都不做（先判断存在性）。
   */
  const patched = patchTextureGpuData(model);
  if (patched) say("已为 " + patched + " 个贴图补上 _gpuData 字段（引擎与 PIXI 的兼容问题）");

  coreModel = findCoreModel(model);
  if (patchParameterIndexById(coreModel)) {
    say("已修好引擎的参数名查找（原本按名字写参数会静默失效）");
  }
  watchRenderedParameters(coreModel, paramIndex("ParamEyeBallX"), paramIndex("ParamEyeBallY"));

  /* 物理开关。
   *
   * 关掉就是把 internalModel.physics 置 null —— 引擎里那句是
   *   `(_d = this.physics) == null ? void 0 : _d.evaluate(model, dt)`
   * （app/assets/live2d/vendor/pixi-live2d-engine.cubism.es.js 附近），置 null 是安全的。
   *
   * ★ 为什么值得给个开关（实测，Electron 420×700 窗口、视线+口型一直在动）：
   *   物理开 + rAF → 36.0 fps；物理关 + rAF → 57.8~61.7 fps。
   *   即物理吃掉了**大约一半的帧时间**（16.2ms → 27.8ms）。这个模型很重
   *   （796 个参数、409 个 drawable、physics3.json 402KB），物理是逐帧按参数算的。
   *   头发/衣摆会摆更自然，但 36fps 和 60fps 的观感差别很明显，所以交给用户选。
   *   默认为**开**（好看优先），关掉的那个选项在设置页里。
   */
  let physicsSaved = null;
  function applyPhysics(on) {
    const im = model && model.internalModel;
    if (!im) return false;
    if (im.physics) physicsSaved = im.physics;
    im.physics = on ? (physicsSaved || im.physics || null) : null;
    state.physics = Boolean(im.physics);
    return state.physics;
  }

  const wantPhysics = new URLSearchParams(location.search).get("physics") !== "0";
  const physicsOn = applyPhysics(wantPhysics);
  say("物理：" + (physicsOn ? "开（头发/衣摆会摆）" : "关（为了帧率）"));

  state.stage = "fitting";
  fit();
  /* ★ 必须等一帧再 fit()。
   *
   * PIXI 的 resizeTo 不是同步生效的：ResizePlugin 里是
   *   queueResize = () => { ...; this._resizeId = requestAnimationFrame(() => this.resize()); }
   * —— 它把 renderer.resize() 推到下一帧。而 fit() 要读 app.screen 来算缩放和位置，
   * 直接在 resize 事件里同步调用，读到的还是**上一次**的尺寸，模型就按旧尺寸摆放，
   * 表现是缩放后模型边缘被切掉（实测：窗口 380×680 → 532×952，state.canvas 仍是上一档）。
   * PIXI 的回调比这里注册得早，同一个 rAF 批次里先跑，所以等一帧后 app.screen 已经是新尺寸。 */
  window.addEventListener("resize", () => requestAnimationFrame(fit));

  /** 推进一帧：更新模型 + 渲染。
   *
   * 现在由页面自己的 rAF 循环驱动（见下面那段 setTimeout），
   * 也暴露出去给探针用（`window.yachiyo.tick(16.7)`）——
   * 探针要能手动推进帧才能把"驱动方式"和"渲染开销"分开量。
   *
   * 历史：无头 Edge + CDP 抓帧时 rAF 几乎不触发（PIXI 的 ticker 整个生命周期
   * 只跑了 1 次），所以当时只能由 Python 显式 tick。 */
  function tick(delta) {
    const dt = Number(delta) || 16.7;
    if (model && typeof model.update === "function") {
      try { model.update(dt); } catch (e) { /* 单帧更新失败不该中断 */ }
    }
    if (app) app.renderer.render(app.stage);
    // state.frames 由 watchRenderedParameters 里的 coreModel.update 计数，
    // 这里不再加 —— 否则外部驱动时一帧会被数两次。
    return state.frames;
  }

  /* ── 驱动：这一页自己按帧率上限推进，不让两个 PIXI ticker 跟着刷新率空烧 ──
   *
   * 历史与实测（Electron 420×700 窗口、视线+口型一直在动）：
   *   setInterval(33) → 24~27 fps；requestAnimationFrame → 58~62 fps。
   * 后来量清楚真正的毛病是**谁在驱动**：
   *   · 模型的自动更新挂在全局共享 ticker（PIXI.Ticker.shared）的 automator 上，
   *     渲染挂在 app.ticker 上 —— 两个 ticker 各自跟着屏幕刷新率跑。这块屏是
   *     75Hz，于是静置时模型的脚本占用把主线程吃到 ~99%（CDP Performance 实测：
   *     1.5 秒里 ScriptDuration 1.486 秒），界面做任何事（切主题、发消息）都掉帧。
   *   · PIXI 的 maxFPS 也给不出干净的 60fps：它的判据是
   *       n = (now - lastFrame) | 0; if (n < 1000/60) return; lastFrame = now - n % (1000/60)
   *     整数截断 + 浮点取余 ⇒ 实测只跑到 ~68.8fps，节奏还不规则，脚本时间只省 4.5%。
   *
   * 所以产品里改成**自己推进**：关掉 automator 的自动更新、停掉 app.ticker，
   * 由本页的 rAF 循环用累加器严格按 frameCap 出帧，dt 传真实间隔（动画时间不漂）。
   * 依据（实测）：autoUpdate=false 后模型完全冻结（帧计数 6867→6867 / 1s），
   * 而手动 tick(16.7)×60 恰好推进 60 帧（6867→6927）—— 动作、物理、口型都在
   * tick 这条路上，所以自己驱动不会丢东西。引擎（含自动更新）只在共享 ticker 上，
   * app.ticker 停掉不影响模型推进（实测：app.ticker 还在跑时 autoUpdate=false 就已经冻结）。
   *
   * 外部驱动（探针用 Python 调 tick）仍然可用：setAutoTick(false) 会停掉这个循环。
   * 窗口最小化时 Chromium 会挂起 rAF，这个循环自然停摆 —— 顺带省下后台 CPU。 */
  let externalDrive = false;
  let autoTicker = null;      // rAF 的 id（历史遗留的 setInterval id 也走这里）
  let autoStop = null;        // rAF 专用：cancelAnimationFrame 得先知道要停

  function stopAutoTicker() {
    if (autoStop) { autoStop(); autoStop = null; return; }
    if (autoTicker) { clearInterval(autoTicker); autoTicker = null; }
  }

  /** 交出驱动权：关掉 automator 的自动更新 + 停掉 app.ticker，只留本页的循环。 */
  function takeOverDriving() {
    if (model) {
      try {
        model.automator.autoUpdate = false;
        /* 视线也交给我们驱动：引擎自带的 autoFocus/autoHitTest 是监听 canvas 上
           的指针事件的，而**无头页面里永远不会有指针经过它**（实测页面里
           一条 pointermove 都收不到）。留着它只会和我们自己的 lookAt 抢。 */
        model.automator.autoFocus = false;
        model.automator.autoHitTest = false;
      } catch (e) {
        say("关 automator.autoUpdate 失败：" + e);
      }
      state.modelAutoUpdate = !!(model.automator && model.automator.autoUpdate);
    }
    if (app && app.ticker) app.ticker.stop();
  }

  /** 本页自己的帧循环：rAF + 累加器，严格按 frameCap 出帧。 */
  function startPacer() {
    if (autoTicker) return;
    let stopped = false;
    let last = performance.now();      // 上一次**真正推进**的时刻（不是上一次 rAF）
    let acc = 0;                       // 累加器：只用来决定"这一帧推不推"，不参与时间
    const loop = (now) => {
      if (stopped) return;
      const dt = now - last;           // 真实间隔：传给模型，动画时间不会漂
      const minMs = frameCap > 0 ? 1000 / frameCap : 0;
      acc += dt;
      /* ★ 为什么用单独的累加器，而不是把余数塞回 last（踩过的坑）：
         把余数写回 last（`last = now - dt % minMs`）会让"下次该推进的时刻"偏离
         vsync 网格 —— 75Hz 屏 + 60fps 上限时几乎每次推进都要多等一个 vsync，
         实测掉到 ~50fps（比不封顶的 73fps 还差）。现在只在"这一帧推不推"上做
         选择，推进时刻始终落在窗口自己的 vsync 网格上：75Hz 屏是"连推 4 帧、
         第 5 帧歇一次"→ 平均 60fps，而第 5 帧的空档正好让出主线程。
         `acc -= minMs` 而不是清零，保证长跑平均就是 frameCap；-1ms 是抗浮点抖动
         的容差（不然 13.31+13.32 这种真间隔会偶尔少推一帧，掉成 45fps）。 */
      if (minMs <= 0 || acc >= minMs - 1) {
        acc = minMs > 0 ? Math.max(0, acc - minMs) : 0;
        last = now;
        try { window.yachiyo.tick(dt > 0 && dt < 250 ? dt : 16.7); } catch (e) { /* 忽略 */ }
      }
      autoTicker = requestAnimationFrame(loop);
    };
    autoTicker = requestAnimationFrame(loop);
    autoStop = () => { stopped = true; if (autoTicker) cancelAnimationFrame(autoTicker); autoTicker = null; };
    state.autoTick = true;
  }

  takeOverDriving();
  startPacer();
  say("驱动：本页 rAF 循环，上限 " + (frameCap || "不封顶") + "fps（PIXI ticker 已停）");

  // ── 就绪：把真正的实现接到先前挂好的接口上 ──
  Object.assign(window.yachiyo, {
    tick,

    /** 内部调试入口：让探针/测试能拿到底层对象（产品代码别用这个）。 */
    _debug() { return { model, app, coreModel }; },

    /** 物理（头发/衣摆）开关。false = 省下约一半帧时间换帧率。 */
    setPhysics(on) {
      const value = applyPhysics(Boolean(on));
      return { physics: value };
    },

    /** 外部驱动开关。
     *
     * setAutoTick(false) = "帧由外面（Python 通过 CDP）驱动"：
     *   停掉本页的 rAF 循环，并确保没有别的驱动者（automator.autoUpdate=false、
     *   app.ticker 停掉）—— 不停干净的话两边会一起推进模型。
     * setAutoTick(true) = 交还给本页自己的循环（见上面 startPacer 的注释）。
     *
     * 注意 modelAutoUpdate 现在**恒为 false**：产品改成自己驱动之后，引擎的自动
     * 更新一直是关的，模型由 window.yachiyo.tick(dt) 推进（动作/物理/口型都在里面）。
     */
    setAutoTick(on) {
      externalDrive = !on;
      stopAutoTicker();
      if (externalDrive) takeOverDriving();
      else startPacer();
      state.autoTick = !!autoTicker;
      state.externalDrive = externalDrive;
      state.modelAutoUpdate = !!(model && model.automator && model.automator.autoUpdate);
      return { autoTick: state.autoTick, externalDrive,
               modelAutoUpdate: state.modelAutoUpdate };
    },

    /** 帧率上限（0 = 不封顶）。默认 60，见上面那段注释里的实测理由。
     *
     * 父页面在**切主题的过渡期间**会临时调到 20，过渡完（约 800ms）再调回 60：
     * 主线程本来就被模型吃到 99%，切主题还要再花 ~43ms 样式重算，必然掉帧；
     * 实测把模型降载能把 66.7ms 的最坏帧压到 40ms、>50ms 的卡顿帧清零。 */
    setFrameCap(fps) {
      frameCap = Math.max(0, Math.min(240, Number(fps) || 0));
      const v = applyFrameCap();
      return {
        fpsCap: v,
        appMaxFPS: app && app.ticker ? app.ticker.maxFPS : null,
        sharedMaxFPS: (Y.PIXI && Y.PIXI.Ticker && Y.PIXI.Ticker.shared)
          ? Y.PIXI.Ticker.shared.maxFPS : null,
      };
    },
    setMouth(value) {
      if (!coreModel) throw new Error("拿不到模型的参数接口（mouthPath 为空）");
      const v = Math.max(0, Math.min(1, Number(value) || 0));
      state.mouth = v;
      coreModel.setParameterValueById(MOUTH_PARAM, v);
      /* ★ 读回来必须用**下标**读（见 paramIndex 的注释）：
         按名字读会落到引擎的"虚构参数"槽位里，而写和读用的是同一个虚构槽位 ——
         "读回一致"会变成一个**假绿灯**（模型其实一步没动）。所以这里按下标从
         模型真正的参数数组里读，读到的值才有意义。 */
      return { wanted: v, readBack: paramValue(paramIndex(MOUTH_PARAM)),
               readBackByName: coreModel.getParameterValueById(MOUTH_PARAM),
               path: state.mouthPath };
    },
    setExpression(name) {
      model.expression(String(name));
      return true;
    },
    playMotion(group, index, priority) {
      // priority: 1=IDLE 2=NORMAL（默认）3=FORCE。
      // idle 动作本身是 NORMAL 优先级，想打断它做别的动作必须用 FORCE，
      // 否则会被拒绝（实测返回 false，而且没有任何报错）。
      return model.motion(String(group),
                          Number.isInteger(index) ? index : undefined,
                          Number.isInteger(priority) ? priority : undefined);
    },
    setScale(k) {
      state.scale = Number(k) || 1;
      fit();
      return state.scale;
    },
    /** 让角色看向**画面坐标**里的一个点（帧像素，左上角为原点）。
     *
     *  ★ 为什么由外面（Python / 主进程）驱动，而不是让引擎自己跟着鼠标：
     *    这一页是隐藏的无头页面，鼠标永远不会经过它，浏览器这侧收不到
     *    任何指针事件 —— 引擎自带的 autoFocus 监听的就是 canvas 上的指针，
     *    在这里永远是空的。所以位置得由界面那一侧转发进来（见 gaze.py）。
     *
     *  ★ 两种用法走两条路（STANDALONE = 是否独立浮窗）：
     *
     *    · 面板里（iframe，不带 ?window）：沿用引擎的 model.focus(x, y)。它按**模型
     *      包围盒**归一化，而盒子只占画面中间一小块，于是 ±70px 就把归一化值顶到 ±1。
     *      实测（画布 380×680，扫 x=0..380 读 focusController.targetX）：x<190 全是
     *      −0.999…−0.767、x>190 全是 +0.767…+0.999，y 以 340 为界是 ±1 两个台阶 ——
     *      只有画面正中约 40px 一条是渐变的。用户明确说过**面板这块不要改**。
     *
     *    · 独立浮窗（?window=1）：改成按**画面半宽/半高**归一化，零点仍是模型包围盒
     *      中心（= 引擎的正前方），整个窗口都是线性区，x/y 各自独立，落在
     *      ParamEyeBallX/Y（±1）与 ParamAngleX/Y（±30°）上。
     *
     *  ★ y 必须取负：画面 y 向下为正，而 focus 空间 +1 是"看上去"。引擎自己的
     *    model.focus 也是这么干的（vendor/pixi-live2d-engine.cubism.es.js:6190
     *    的 `focus(Math.cos(radian), -Math.sin(radian))`，toModelPosition 已把
     *    画面 y 翻成模型 y）。少这个负号 = 鼠标往上模型往下看。 */
    lookAt(x, y) {
      if (!model) throw new Error("模型没就绪（lookAt）");
      const w = app.screen.width;
      const h = app.screen.height;
      const cx = Math.max(0, Math.min(w, Number(x) || 0));
      const cy = Math.max(0, Math.min(h, Number(y) || 0));
      if (!STANDALONE) {
        model.focus(cx, cy);
      } else {
        const anchor = state.gazeAnchor || [w / 2, h / 2];
        const halfW = Math.max(1, w / 2) * GAZE_SPAN;
        const halfH = Math.max(1, h / 2) * GAZE_SPAN;
        const nx = Math.max(-1, Math.min(1, (cx - anchor[0]) / halfW));
        const ny = Math.max(-1, Math.min(1, (anchor[1] - cy) / halfH));
        model.internalModel.focusController.focus(nx, ny);
      }
      state.look = [Math.round(cx), Math.round(cy)];
      return state.look;
    },
    /** 视线回正前方。
     *  ★ 不能拿"画面中心"当正前方：模型的原点在它自己的包围盒上，
     *    画面中心对模型来说偏上偏右。focusController(0, 0) 才是真正的正前方。 */
    lookForward() {
      if (!model) throw new Error("模型没就绪（lookForward）");
      model.internalModel.focusController.focus(0, 0);
      state.look = null;
      return true;
    },
    /** 读回眼球参数（±1），用来确认视线真的进了模型而不是只改了个变量。
     *  读的是**渲染那一刻**的值（见 watchRenderedParameters）。
     *  顺便把 FocusController 的目标也带出来：目标是喂进去的归一化值，
     *  参数是引擎算完写进模型的结果 —— 两个一起看，链条才算完整。 */
    eyeBall() {
      if (!coreModel) return null;
      const fc = model && model.internalModel && model.internalModel.focusController;
      const rendered = state.renderedEye || {};
      return {
        x: rendered.x === undefined ? null : rendered.x,
        y: rendered.y === undefined ? null : rendered.y,
        target: fc ? { x: fc.targetX, y: fc.targetY } : null,
        look: state.look,
      };
    },
    listMotions() {
      const s = model.internalModel && model.internalModel.settings;
      if (!s) return {};
      // 这个引擎里 `motionGroups` 是 undefined，动作定义在 settings.motions 上
      // （实测：物体 groups 为 None，而 settings 的键里有 motions / idle）。
      const out = {};
      const motions = s.motions;
      if (motions && typeof motions === "object" && !Array.isArray(motions)) {
        for (const [group, list] of Object.entries(motions)) {
          out[group] = Array.isArray(list) ? list.length : (list ? 1 : 0);
        }
        return out;
      }
      for (const g of (s.motionGroups || [])) {
        try { out[g] = s.getMotionFiles(g).length; } catch (e) { out[g] = -1; }
      }
      return out;
    },
    listExpressions() {
      const s = model.internalModel && model.internalModel.settings;
      const ex = (s && s.expressions) || [];
      return ex.map((e) => e.Name || e.name || e.Id || e.id);
    },
  });

  state.ready = true;
  state.stage = "ready";
  say("模型就绪：动作组=" + JSON.stringify(window.yachiyo.listMotions())
      + " 表情=" + JSON.stringify(window.yachiyo.listExpressions())
      + " 口型路径=" + (state.mouthPath || "(无)"));
  try { model.motion("Idle"); } catch (e) { say("Idle 动作启动失败：" + e); }
}

start().catch((err) => Y.fail(err && err.message ? err.message : err));
</script>

<script>
/* ── 第三段：独立窗口模式（?window=1）──
 *
 * 在面板里时，这一页是被 iframe 贴在玻璃面板上的；脱离之后它自己就是一个
 * **透明无边框窗口**（desktop/main.js 的 createPetWindow），这里只做三件事：
 *
 *   1. 拖动自己 —— 按住角色任意处，按**屏幕坐标增量**搬窗口（IPC pet:move）。
 *      不用 -webkit-app-region: drag：它会把整页的鼠标事件都吃掉（以后想加
 *      点击互动就做不了了），而且探针没法验证一个 CSS 属性有没有真的拖动窗口。
 *      用 screenX/screenY 的**增量**而不是"指针相对窗口的位置"：窗口跟着指针
 *      一起动，相对位置每帧都在变，只有屏幕绝对坐标是稳定的。
 *   2. 右键 → 让主进程弹原生菜单（收回面板 / 始终置顶 / 关闭）。
 *   3. 接主进程转发来的 window.yachiyo 调用（视线由主进程的 cursorLoop 驱动，
 *      口型/主题/帧率上限由渲染层发过来）。
 */
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("window") !== "1") return;
  document.documentElement.classList.add("pet-standalone");

  const say = (msg) => {
    try { window.__yachiyo.say("[窗口] " + msg); } catch { /* 诊断不该影响功能 */ }
  };
  const shell = window.yachiyoShell;
  if (!shell) {
    say("没有 yachiyoShell（preload 没挂上？），拖动和菜单不可用");
    return;
  }

  /* 1) 主进程转发来的调用。模型没就绪时 lookAt/setMouth 会抛 notReady，
        吞掉即可 —— 下一帧还会再发一次，就绪后自然生效。 */
  shell.onPetCmd((cmd) => {
    if (!cmd || typeof cmd.name !== "string") return;
    const target = window.yachiyo;
    const fn = target && target[cmd.name];
    if (typeof fn !== "function") return;
    try {
      fn.apply(target, Array.isArray(cmd.args) ? cmd.args : []);
    } catch {
      /* notReady：等模型起来 */
    }
  });

  /* 2) 拖动。pending 只留最后一帧的位置，用 rAF 合并 —— 指针事件比屏幕刷新快，
        每个事件都发一次 IPC 会把主进程的消息队列灌满。 */
  let dragging = false;
  let startX = 0, startY = 0, winX = 0, winY = 0;
  let pending = null, rafId = 0;

  const flush = () => {
    rafId = 0;
    if (!pending) return;
    shell.petMove(pending.x, pending.y);
    pending = null;
  };

  addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    dragging = true;
    startX = event.screenX;
    startY = event.screenY;
    winX = window.screenX;
    winY = window.screenY;
    document.documentElement.classList.add("dragging");
    try { event.target.setPointerCapture(event.pointerId); } catch { /* 拿不到捕获也能拖 */ }
  });

  addEventListener("pointermove", (event) => {
    if (!dragging) return;
    pending = { x: winX + (event.screenX - startX), y: winY + (event.screenY - startY) };
    if (!rafId) rafId = requestAnimationFrame(flush);
  });

  const stop = (why) => {
    if (!dragging) return;
    dragging = false;
    document.documentElement.classList.remove("dragging");
    if (pending) { shell.petMove(pending.x, pending.y); pending = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    say("拖动结束（" + why + "）：窗口=" + window.screenX + "," + window.screenY);
  };
  addEventListener("pointerup", () => stop("抬起"));
  addEventListener("pointercancel", () => stop("取消"));

  /* 3) 右键 → 主进程弹原生菜单 */
  addEventListener("contextmenu", (event) => {
    event.preventDefault();
    shell.petMenu();
  });

  say("独立窗口模式：位置=" + window.screenX + "," + window.screenY
      + " 尺寸=" + window.innerWidth + "×" + window.innerHeight);
})();
</script>
</body>
</html>
