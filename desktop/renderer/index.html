<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*;" />
  <title>月见八千代</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 背景层：夜空 + 极光 + 月盘 + 星点 + 颗粒。玻璃卡片都浮在这一层上面。 -->
  <div class="backdrop" aria-hidden="true">
    <div class="sky"></div>
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="moon"></div>
    <div class="stars"></div>
    <div class="grain"></div>
  </div>

  <div id="app">
    <header class="titlebar">
      <div class="brand">
        <span class="mark">月</span>
        <span class="brand-text">月见八千代</span>
        <span class="brand-sub">Yachiyo</span>
      </div>
      <div class="fill"></div>

      <!-- 外观快捷开关：深色 / 浅色（完整三选一在设置里） -->
      <div class="seg seg-theme" id="theme-quick" role="radiogroup" aria-label="外观">
        <button class="seg-btn" data-theme-set="dark" role="radio" aria-checked="true" title="深色">&#x263E;</button>
        <button class="seg-btn" data-theme-set="light" role="radio" aria-checked="false" title="浅色">&#x2600;</button>
      </div>

      <button id="btn-min" class="winbtn" title="最小化">&#x2500;</button>
      <button id="btn-close" class="winbtn close" title="关闭">&#x2715;</button>
    </header>

    <div class="body">
      <section class="chat glass">
        <div class="chat-header">
          <div class="avatar">八</div>
          <div class="who">
            <div class="name">月见八千代</div>
            <div class="sub">月读管理员</div>
          </div>
          <span id="dot" class="dot"></span>
          <button id="btn-settings" class="dock" data-act="settings" title="设置" aria-label="设置">&#x2699;</button>
        </div>

        <div id="messages" class="messages"></div>
        <!-- is-empty：首条状态文字也要淡入，不能"啪"地出现（见 style.css 的 .status.is-empty） -->
        <div id="status" class="status is-empty"></div>

        <div id="input-shell" class="input-shell">
          <textarea id="input" rows="1" placeholder="和八千代说点什么…"></textarea>
          <!-- 发送 / 停止叠在同一个槽里交叉淡入淡出（.btn-slot，见 style.css）：
               换人那一刻不再"跳"。两个按钮都留在 DOM 里，仍由 .hidden 类驱动。 -->
          <div class="btn-slot">
            <button id="btn-send" class="sendbtn" title="发送（回车）">&#x2191;</button>
            <button id="btn-stop" class="stopbtn hidden" title="停止">&#x25A0;</button>
          </div>
        </div>
      </section>

      <section class="panel glass">
        <div class="panel-inner">
          <div class="stage"><iframe id="pet" title="八千代"></iframe></div>
          <div id="panel-status" class="panel-status">正在唤醒八千代…</div>
        </div>
      </section>
    </div>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
